<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Agile Day Rush</title>
  <desc id="desc">A three-lane arcade runner dodging daily obstacles and collecting power items</desc>
  <defs>
